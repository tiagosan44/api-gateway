name: Code Generation Validation

on: [pull_request, push]

jobs:
  validate-code-generation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Generate code from specs
        run: mvn clean generate-sources

      - name: Check for uncommitted generated code differences
        run: |
          # Generate code
          mvn clean generate-sources -q

          # Check if generated sources exist
          if [ ! -d "target/generated-sources/openapi" ]; then
            echo "❌ Generated sources not found! Generation failed."
            exit 1
          fi

          if [ ! -d "target/generated-sources/openapi-client" ]; then
            echo "❌ Generated client sources not found! Generation failed."
            exit 1
          fi

          echo "✅ Code generation successful"

          # Count generated files
          API_FILES=$(find target/generated-sources/openapi -name "*.java" | wc -l)
          CLIENT_FILES=$(find target/generated-sources/openapi-client -name "*.java" | wc -l)

          echo "📊 Generated $API_FILES API interface files"
          echo "📊 Generated $CLIENT_FILES client files"

          if [ "$API_FILES" -eq 0 ] || [ "$CLIENT_FILES" -eq 0 ]; then
            echo "❌ No Java files were generated!"
            exit 1
          fi

          echo "✅ Code generation validation passed"

      - name: Verify generated code structure
        run: |
          echo "Checking generated API interfaces..."
          if [ ! -d "target/generated-sources/openapi/src/main/java/org/spatino/apigateway/generated/api" ]; then
            echo "❌ API package not found!"
            exit 1
          fi

          echo "Checking generated models..."
          if [ ! -d "target/generated-sources/openapi/src/main/java/org/spatino/apigateway/generated/model" ]; then
            echo "❌ Model package not found!"
            exit 1
          fi

          echo "Checking generated client..."
          if [ ! -d "target/generated-sources/openapi-client/src/main/java/org/spatino/apigateway/generated/client" ]; then
            echo "❌ Client package not found!"
            exit 1
          fi

          echo "✅ All expected packages generated correctly"

      - name: List generated API files
        run: |
          echo "📁 Generated API files:"
          find target/generated-sources/openapi -name "*Api.java" -type f | sort

          echo ""
          echo "📁 Generated Model files:"
          find target/generated-sources/openapi -name "*.java" -path "*/model/*" -type f | sort | head -20
