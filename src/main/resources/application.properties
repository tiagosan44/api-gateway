spring.application.name=api-gateway
server.port=8080

# Logging
logging.level.org.spatino.apigateway=INFO
logging.level.org.springframework.cloud.gateway=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.default.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.default.sliding-window-size=10

# Retry Configuration
resilience4j.retry.instances.default.max-attempts=3
resilience4j.retry.instances.default.wait-duration=100ms
resilience4j.retry.instances.default.enable-exponential-backoff=true
resilience4j.retry.instances.default.exponential-backoff-multiplier=2

# Upstream Services Configuration
upstream.product-service.instances=http://localhost:8081,http://localhost:8082,http://localhost:8083
upstream.inventory-service.instances=http://localhost:8084,http://localhost:8085

# Health Check Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
